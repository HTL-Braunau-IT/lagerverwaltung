[phases.setup]
nixPkgs = ["nodejs_24", "npm"]
nixpkgsArchive = "9dcb002ca1690658be4a04645215baea8b95f31d"

[providers]
node = "custom"

[phases.install]
cmds = ["npm install --frozen-lockfile"]

[phases.build]
cmds = ["npm run build"]

[variables]
NODE_OPTIONS = "--max-old-space-size=4096"

[start]
cmd = "npm start"