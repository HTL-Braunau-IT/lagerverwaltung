name: Release Drafter

# Keeps a draft of the next release (v<next patch>) up to date with every push
# to main. Publishing the draft triggers promote-stable.yml, which is the
# rollout to every self-hosting school (see docs/SELF_HOSTING_UPSTREAM.md).
# On pull requests it only applies labels from the PR title (autolabeler).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, edited, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        with:
          config-name: release-drafter.yml
          # PR runs only label; they must not touch the draft.
          disable-releaser: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
