name: CI

# verify: typecheck, tests, lint.
# image:  production Docker image, only after verify passed.
#   pull request  -> built to validate the Dockerfile, not published
#   push to main  -> published to GHCR as :latest and :sha-<commit>
# Releases do not rebuild: promote-stable.yml retags :sha-<commit> as :stable.
# Self-hosted installs pick a channel via APP_IMAGE (see README.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push to the same ref makes the in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      # prisma.config.ts needs a URL; nothing connects to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      # `ci` honours the lockfile exactly (postinstall runs `prisma generate`).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Manual runs from other branches build but never publish :latest.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=sha,prefix=sha-,format=long
            type=ref,event=pr

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
