name: Promote stable

# Publishing a GitHub release promotes the image CI already built for that
# commit: :sha-<commit> is retagged as :stable and :<release tag>. No rebuild,
# so self-hosting schools run exactly the bits our own production ran.
# Only main builds produce :sha-* tags, so a release tagged on a commit that is
# not on main fails here instead of shipping unreviewed code.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  actions: read # look up the CI run of the release commit

jobs:
  promote:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag sha-<commit> as stable and the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(git rev-list -n1 "$TAG")
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::Release-Tag $TAG zeigt auf einen Commit, der nicht auf main liegt."; exit 1; }
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}

          # Only promote what CI built and verified for exactly this commit on
          # main. A release published right after a push races CI, so wait for
          # that run (CI takes ~10 min) instead of failing.
          for i in $(seq 1 40); do
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event push --commit "$SHA" --limit 1 --json status,conclusion,url \
              --jq '.[0] // {}')
            STATUS=$(jq -r '.status // ""' <<<"$RUN")
            CONCLUSION=$(jq -r '.conclusion // ""' <<<"$RUN")
            if [ "$STATUS" = completed ]; then
              [ "$CONCLUSION" = success ] && break
              echo "::error::CI für $SHA endete mit '$CONCLUSION' ($(jq -r .url <<<"$RUN")). CI für diesen Commit erneut ausführen, dann diesen Workflow."
              exit 1
            fi
            [ "$i" = 40 ] && { echo "::error::Kein erfolgreicher CI-Lauf für $SHA nach 20 Minuten."; exit 1; }
            echo "Warte auf CI für $SHA (${STATUS:-noch nicht gestartet}) ... $i/40"
            sleep 30
          done

          # Pin by digest so the promoted bits cannot change between check and retag.
          DIGEST=$(docker buildx imagetools inspect "$IMG:sha-$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Promoting $IMG:sha-$SHA ($DIGEST) -> stable, $TAG"
          docker buildx imagetools create \
            -t "$IMG:stable" \
            -t "$IMG:$TAG" \
            "$IMG@$DIGEST"
