# Self-hosting stack: Postgres + Lagershop. See docs/self-hosting.md.
#   cp .env.example .env   # fill in
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-lagerverwaltung}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # :main follows every push to main; :stable only tagged releases (vX.Y.Z).
    image: ghcr.io/htl-braunau-it/lagerverwaltung:${APP_TAG:-main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lager}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lagerverwaltung}
    ports:
      # Bind to localhost only; put a TLS reverse proxy (Caddy, nginx, Traefik) in front.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # Uploads, login background, favicon
      - app-public:/app/public

volumes:
  db-data:
  app-public:
